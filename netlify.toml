[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"

# Telegram webhook
[[redirects]]
  from = "/apply/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200
  force = true

# Other API functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# React SPA routes — MUST COME LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200